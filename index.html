<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG das Batidas - Delivery</title>
    <style>
        :root {
            --bg-base: #070707;
            --card-bg: #121212;
            --primary: #f39c12;
            --primary-glow: rgba(243, 156, 18, 0.2);
            --accent: #25d366;
            --text-main: #f8f9fa;
            --text-muted: #9e9e9e;
            --border: #222222;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 130px;
        }

        header {
            background: linear-gradient(180deg, #161616 0%, var(--bg-base) 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .logo-badge-top {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        header h1 {
            color: var(--text-main);
            margin: 0;
            font-size: 2rem;
            letter-spacing: 1px;
            font-weight: 900;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--primary);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 8px 0 0 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 15px;
        }

        .categoria-titulo {
            color: var(--primary);
            font-size: 0.95rem;
            margin: 30px 5px 15px 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .categoria-titulo::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .card {
            background-color: var(--card-bg);
            margin: 14px 0;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(243, 156, 18, 0.4);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card h3 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.3;
        }

        .badge-tag {
            background: rgba(243, 156, 18, 0.15);
            color: var(--primary);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .card p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 12px;
        }

        .preco {
            color: var(--primary);
            font-weight: 800;
            font-size: 1.2rem;
        }

        .btn-add {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: transform 0.1s;
        }

        .btn-add:active {
            transform: scale(0.96);
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(12, 12, 12, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--primary);
            box-sizing: border-box;
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
        }

        .cart-total-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-total-value {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 900;
        }

        .btn-checkout {
            background: var(--accent);
            border: none;
            padding: 12px 24px;
            color: #fff;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            letter-spacing: 0.5px;
        }

        #modalPedido {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 20px 15px;
        }

        .modal-content {
            max-width: 480px;
            margin: 20px auto;
            background: #141414;
            padding: 24px;
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .modal-content h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #090909;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-action-green {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-action-red {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #e74c3c;
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn-action-ghost {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-badge-top">Artesanais & Exclusivas</div>
    <h1>QG das <span>Batidas</span></h1>
    <p>As melhores batidas da região na sua casa</p>
</header>

<div class="container" id="vitrine">
    <div style="text-align:center; padding: 40px; color: var(--text-muted);">A carregar cardápio...</div>
</div>

<div class="cart-bar" id="cart-bar" style="display: none;">
    <div>
        <div class="cart-total-text">Total do Pedido</div>
        <div class="cart-total-value" id="cart-total">R$ 0,00</div>
    </div>
    <button class="btn-checkout" onclick="abrirModal()">FECHAR PEDIDO</button>
</div>

<div id="modalPedido">
    <div class="modal-content">
        <h2>Finalizar Pedido</h2>
        <div id="lista-resumo"></div>
        <p style="text-align:right; font-size:1rem; margin:15px 0 10px 0;">Total: <span id="modal-total" style="color:var(--primary); font-weight:bold;">R$ 0,00</span></p>
        
        <input type="text" id="nomeCliente" placeholder="Seu Nome Completo">
        <input type="text" id="cep" placeholder="CEP (Preenche o endereço sozinho)" onblur="buscarCEP(this.value)">
        <input type="text" id="rua" placeholder="Endereço / Rua">
        <input type="text" id="num" placeholder="Número e Complemento">
        <input type="text" id="bairro" placeholder="Bairro">
        <input type="text" id="troco" placeholder="Troco para quanto? (Opcional)">
        
        <select id="pagamento">
            <option value="Pix">Pix</option>
            <option value="Cartão">Cartão na Entrega</option>
            <option value="Dinheiro">Dinheiro</option>
        </select>
        <textarea id="obs" placeholder="Observações (ex: caprichar no gelo, pouco doce...)" rows="2"></textarea>
        
        <button class="btn-action-green" onclick="finalizarPedido()">ENVIAR PEDIDO NO WHATSAPP</button>
        <button class="btn-action-red" onclick="limparTudo()">LIMPAR CARRINHO</button>
        <button class="btn-action-ghost" onclick="fecharModal()">Continuar Comprando</button>
    </div>
</div>

<script>
    let baseProdutos = [];
    let carrinho = JSON.parse(localStorage.getItem('carrinho_qg')) || [];

    async function carregar() {
        try {
            const res = await fetch('produtos.json?t=' + new Date().getTime());
            baseProdutos = await res.json();
            let html = '', catAtual = '';
            baseProdutos.forEach((p, i) => {
                if (p.cat !== catAtual) { 
                    html += `<div class="categoria-titulo">${p.cat}</div>`; 
                    catAtual = p.cat; 
                }
                html += `
                    <div class="card">
                        <div class="card-top">
                            <div>
                                <h3>${p.nome}</h3>
                            </div>
                            ${p.badge ? `<span class="badge-tag">${p.badge}</span>` : ''}
                        </div>
                        <p>${p.desc || ''}</p>
                        <div class="card-footer">
                            <span class="preco">R$ ${p.preco.toFixed(2)}</span>
                            <button class="btn-add" onclick="adicionar(${i})">+ ADICIONAR</button>
                        </div>
                    </div>`;
            });
            document.getElementById('vitrine').innerHTML = html;
        } catch (e) { 
            document.getElementById('vitrine').innerHTML = '<p style="text-align:center; color:#e74c3c;">Erro ao carregar cardápio. Atualize a página.</p>'; 
        }
    }

    async function buscarCEP(cep) {
        cep = cep.replace(/\D/g, '');
        if(cep.length === 8) {
            try {
                const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await res.json();
                if(!data.erro) { 
                    document.getElementById('rua').value = data.logradouro; 
                    document.getElementById('bairro').value = data.bairro; 
                    document.getElementById('num').focus();
                }
            } catch(err) {}
        }
    }

    function adicionar(i) { carrinho.push(baseProdutos[i]); salvar(); }
    function remover(i) { carrinho.splice(i, 1); salvar(); abrirModal(); }
    function salvar() { localStorage.setItem('carrinho_qg', JSON.stringify(carrinho)); recalcular(); }
    function limparTudo() { carrinho = []; salvar(); fecharModal(); }

    function recalcular() {
        const total = carrinho.reduce((a, b) => a + b.preco, 0);
        document.getElementById('cart-total').innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('modal-total').innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('cart-bar').style.display = carrinho.length > 0 ? 'flex' : 'none';
    }

    function abrirModal() {
        if(carrinho.length === 0) return;
        let html = '';
        carrinho.forEach((p, i) => {
            html += `
                <div class="item-lista">
                    <span><b>${p.nome}</b><br><span style="color:var(--primary);">R$ ${p.preco.toFixed(2)}</span></span>
                    <button onclick="remover(${i})" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-size:1.1rem; padding:5px;">🗑️</button>
                </div>`;
        });
        document.getElementById('lista-resumo').innerHTML = html;
        document.getElementById('modalPedido').style.display = 'block';
    }

    function fecharModal() { document.getElementById('modalPedido').style.display = 'none'; }

    function finalizarPedido() {
        const nome = document.getElementById('nomeCliente').value.trim();
        const rua = document.getElementById('rua').value.trim();
        if(!nome) { alert('Por favor, preencha o seu nome!'); document.getElementById('nomeCliente').focus(); return; }
        if(!rua) { alert('Por favor, preencha o endereço!'); document.getElementById('rua').focus(); return; }

        const total = carrinho.reduce((a, b) => a + b.preco, 0);
        let msg = `*NOVO PEDIDO - QG DAS BATIDAS*\n\n`;
        carrinho.forEach(item => msg += `• ${item.nome} - R$ ${item.preco.toFixed(2)}\n`);
        msg += `\n*TOTAL: R$ ${total.toFixed(2)}*\n\n*ENDEREÇO DE ENTREGA:*\nNome: ${nome}\nEnd: ${rua}, ${document.getElementById('num').value} - Bairro: ${document.getElementById('bairro').value}\nPagamento: ${document.getElementById('pagamento').value}\nTroco: ${document.getElementById('troco').value || "Não precisa"}\nObs: ${document.getElementById('obs').value || "Nenhuma"}`;
        
        window.open(`https://api.whatsapp.com/send?phone=5511942971753&text=${encodeURIComponent(msg)}`, '_blank');
    }

    window.onload = () => { carregar(); recalcular(); };
</script>
</body>
            </html>
